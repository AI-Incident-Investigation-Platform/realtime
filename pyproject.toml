[project]
name = "realtime"
version = "0.1.0"
description = "AIIP WebSocket live event fan-out"
requires-python = ">=3.14"
dependencies = [
  "aiip-kit",
  "aio-pika>=10.2.1",
  "fastapi>=0.143.3",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.15.1",
  "redis>=8.1.0",
  "uvicorn>=0.54.0",
  "prometheus-client>=0.26.0",
]

[tool.uv.sources]
aiip-kit = { path = "../aiip-kit", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.1", "mypy>=2.4.0",
  "testcontainers[rabbitmq,redis]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../aiip-kit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["case(id): scenario from tests/scenarios.toml"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
