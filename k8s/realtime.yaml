apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  labels: {app: realtime}
spec:
  selector:
    matchLabels: {app: realtime}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: realtime}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8009"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: realtime
          image: aiip-realtime:latest
          ports:
            - name: http
              containerPort: 8009
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: secret
              mountPath: /app/realtime/config.toml
              subPath: config.toml
      volumes:
        - name: secret
          secret: {secretName: realtime}
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
spec:
  selector: {app: realtime}
  ports:
    - name: http
      port: 8009
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: realtime-ratelimit
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-realtime-ratelimit@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /ws/v1/events
            pathType: Exact
            backend:
              service:
                name: realtime
                port: {name: http}
